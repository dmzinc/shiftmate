<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>ShiftMate — Your rota, organised</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--ink:#172235;--muted:#738096;--line:#e6eaf0;--paper:#f6f8fb;--nav:#111b2c;--blue:#365ee8;--blue2:#edf1ff;--green:#16835d;--red:#c64c55;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.brand{font-size:22px;font-weight:800;letter-spacing:-.8px}.brand span{color:#86a0ff}.btn{padding:10px 15px;border-radius:10px;background:var(--blue);color:white;font-weight:650}.btn.secondary{background:#eef1f6;color:#27354a}.btn.ghost{background:transparent;color:var(--muted)}.btn.danger{background:#fff0f0;color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:#5d6a7f}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:white;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:#8098ff;box-shadow:0 0 0 3px #365ee81c}.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 15%,#e5ebff,transparent 40%),var(--paper)}.auth-card{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:22px;padding:32px;box-shadow:0 18px 60px #20345a12}.auth-card h1{font-size:27px;line-height:1.15;margin:25px 0 7px;letter-spacing:-1px}.auth-tabs{display:flex;background:#f2f4f8;padding:4px;border-radius:10px;margin:22px 0}.auth-tabs button{flex:1;padding:9px;border-radius:8px;background:transparent;color:var(--muted)}.auth-tabs button.active{background:white;color:var(--ink);box-shadow:0 1px 4px #0001}.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:238px;background:var(--nav);color:white;padding:25px 17px;display:flex;flex-direction:column;z-index:5}.sidebar .brand{padding:4px 12px 32px}.nav-label{font-size:10px;color:#7f8da5;text-transform:uppercase;letter-spacing:1.2px;padding:10px 12px}.nav-btn{display:flex;align-items:center;gap:12px;padding:11px 12px;margin:2px 0;width:100%;text-align:left;color:#b8c2d3;background:transparent;border-radius:10px}.nav-btn.active,.nav-btn:hover{background:#24334b;color:white}.nav-icon{width:20px;text-align:center}.sidebar-bottom{margin-top:auto;border-top:1px solid #2a3548;padding:16px 10px 0;color:#aab5c7}.main{margin-left:238px;padding:28px 34px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.topbar h1{font-size:26px;letter-spacing:-.8px;margin:0}.user-pill{background:white;border:1px solid var(--line);border-radius:30px;padding:8px 13px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:0 3px 14px #182b4a05}.stat-label{font-size:12px;color:var(--muted);font-weight:650}.stat-num{font-size:29px;font-weight:780;letter-spacing:-1px;margin-top:6px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px}.section-head h2{font-size:17px;margin:0}.empty{padding:55px 24px;text-align:center;background:white;border:1px dashed #d5dce7;border-radius:var(--radius)}.empty .emoji{font-size:34px}.empty h2{margin:12px 0 6px}.shift-list{display:grid;gap:10px}.shift-row{display:flex;align-items:center;gap:15px;padding:15px;background:white;border:1px solid var(--line);border-radius:13px;cursor:pointer}.shift-row:hover{border-color:#9aafff}.datebox{width:49px;min-width:49px;height:54px;border-radius:11px;background:var(--blue2);display:grid;place-content:center;text-align:center;color:var(--blue)}.datebox b{font-size:19px;line-height:1.1}.datebox span{font-size:10px;text-transform:uppercase;font-weight:750}.shift-info{flex:1;min-width:0}.shift-info b{display:block}.shift-info span{font-size:12px;color:var(--muted)}.tag{font-size:11px;background:#edf7f2;color:var(--green);padding:5px 9px;border-radius:20px;font-weight:700}.rotation-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.rotation{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.rotation h3{margin:0 0 5px}.rotation-actions{display:flex;gap:7px;margin-top:14px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal-head{text-align:center;font-size:11px;color:var(--muted);padding:8px}.cal-day{min-height:88px;background:white;border:1px solid var(--line);border-radius:9px;padding:7px;font-size:12px}.cal-day.today{border-color:var(--blue)}.cal-shift{display:block;margin-top:4px;padding:3px 5px;border-radius:5px;background:#eaf0ff;color:#365ee8;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.modal-back{position:fixed;inset:0;background:#10182788;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 24px 80px #0003}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.modal-head h2{font-size:19px;margin:0}.close{background:#f0f2f6;border-radius:8px;width:32px;height:32px;font-size:19px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.note{padding:12px;background:#f6f8fb;border-radius:10px;margin:9px 0}.note-actions{display:flex;gap:8px;margin-top:8px}.notice{padding:11px 13px;background:#eef3ff;color:#314b9b;border-radius:10px;font-size:13px;margin:12px 0}.error{background:#fff0f0;color:#a83740}.success{background:#eaf7f0;color:#176947}.filebox{border:1px dashed #bdc8dc;border-radius:12px;padding:22px;text-align:center;background:#fafbfe}.mobile-menu{display:none}.profile-grid{max-width:600px}
@media(max-width:850px){.sidebar{width:68px;padding:18px 8px}.sidebar .brand{font-size:0;padding:8px 10px 30px}.sidebar .brand:first-letter{font-size:22px}.nav-label,.nav-btn .nav-text,.sidebar-bottom .nav-text{display:none}.nav-btn{justify-content:center;padding:13px 5px}.nav-icon{font-size:18px}.main{margin-left:68px;padding:22px 18px}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.sidebar{display:none}.main{margin:0;padding:18px 14px 85px}.topbar h1{font-size:22px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:14px}.stat-num{font-size:24px}.rotation-list{grid-template-columns:1fr}.shift-row{gap:10px;padding:12px}.tag{display:none}.mobile-menu{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--line);z-index:10;justify-content:space-around;padding:8px 3px calc(8px + env(safe-area-inset-bottom))}.mobile-menu button{background:transparent;color:var(--muted);font-size:11px;display:grid;gap:2px;justify-items:center}.mobile-menu button span{font-size:19px}.cal-day{min-height:63px;padding:4px;font-size:10px}.cal-shift{font-size:0;height:6px;padding:0;border-radius:4px}.topbar .user-pill{display:none}}

/* Personal workspace dashboard */
.home-dashboard{max-width:1500px}
.home-welcome{margin:0 0 30px}
.home-kicker{font-size:12px;font-weight:800;letter-spacing:1.35px;color:#7186b4;margin-bottom:10px}
.home-welcome h1{font-size:36px;line-height:1.18;letter-spacing:-1.25px;margin:0 0 12px;color:#172b50}
.home-welcome p{font-size:17px;color:#7386a8;margin:0}
.home-onboarding{background:#fff;border:1px solid #dfe6f4;border-radius:24px;padding:28px 30px;margin:0 0 26px;box-shadow:0 8px 30px #233b6810}
.home-onboarding h2{font-size:29px;letter-spacing:-.8px;margin:0 0 10px;color:#172b50}
.home-onboarding>p{color:#7183a4;line-height:1.65;margin:0 0 22px}
.home-callout{padding:17px 19px;background:#f0f3ff;border:1px solid #dce3ff;color:#40588e;border-radius:15px;margin-bottom:24px}
.home-primary{padding:16px 23px;border-radius:14px;font-size:15px;background:#5056df}
.home-feature-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:24px;align-items:stretch}
.home-current,.home-next{border-radius:25px;padding:28px;min-height:285px}
.home-current{color:white;background:linear-gradient(115deg,#1e3267 0%,#3e4caf 100%);position:relative;overflow:hidden}
.home-current:after{content:"";position:absolute;width:270px;height:270px;border:52px solid #ffffff0b;border-radius:50%;right:-70px;top:-55px;pointer-events:none}
.home-current .home-kicker{color:#c8d4ff;position:relative;z-index:1}
.home-current h2{font-size:32px;line-height:1.2;letter-spacing:-1px;margin:16px 0 22px;position:relative;z-index:1}
.home-current p{font-size:17px;color:#edf1ff;margin:0 0 18px;position:relative;z-index:1}
.home-current-meta{font-size:13px;color:#d5ddff;margin:0 0 18px;position:relative;z-index:1}
.home-light-btn{background:#fff;color:#263b79;position:relative;z-index:1;padding:13px 18px}
.home-next{background:#fff;border:1px solid #dfe6f4;box-shadow:0 5px 22px #233b6808}
.home-next .home-kicker{margin-bottom:12px}
.home-next-empty{min-height:125px;border:1px dashed #ccd7ed;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;color:#7486a8;margin-bottom:26px}
.home-next-empty p{font-size:16px;line-height:1.55;margin:8px 0 0}
.home-next-icon{font-size:22px;color:#8093bd}
.home-next-shift{margin:0 0 20px}
.home-next-shift .shift-row{box-shadow:none}
.home-secondary-btn{padding:13px 18px;background:#5056df;border-radius:14px}
.home-lower{margin-top:28px}
@media(max-width:850px){.home-feature-grid{grid-template-columns:1fr 1fr;gap:14px}.home-current,.home-next{padding:22px;min-height:260px}.home-welcome h1{font-size:31px}}
@media(max-width:600px){.home-welcome{margin-bottom:22px}.home-welcome h1{font-size:29px}.home-welcome p{font-size:15px}.home-onboarding{padding:22px 19px;border-radius:19px}.home-onboarding h2{font-size:24px}.home-feature-grid{grid-template-columns:1fr}.home-current,.home-next{min-height:unset;padding:23px;border-radius:20px}.home-current h2{font-size:27px}.home-next-empty{min-height:115px}.home-primary,.home-secondary-btn{width:100%}}


/* AI daily motivation card */
.home-motivation{background:linear-gradient(120deg,#f2f5ff,#fff 70%);border:1px solid #dfe6f7;border-radius:22px;padding:23px 26px;margin:0 0 25px;box-shadow:0 7px 25px #243e6a0b}
.home-motivation-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.home-motivation-head .home-kicker{margin:0 0 5px}
.home-motivation-label{font-size:15px;font-weight:700;color:#243b68}
.home-ai-pill{font-size:10px;font-weight:800;letter-spacing:.7px;color:#4e55d8;background:#e5e9ff;border-radius:20px;padding:7px 10px}
.home-motivation-body blockquote{font-size:21px;line-height:1.45;font-weight:650;letter-spacing:-.35px;color:#263c70;margin:12px 0 16px;padding:0;border:0}
.home-motivation-loading{display:block;color:#7585a5;font-size:14px;padding:15px 0}
.home-motivation-foot{display:flex;justify-content:space-between;gap:12px;color:#8390aa;font-size:11px}
@media(max-width:600px){.home-motivation{padding:20px;border-radius:18px}.home-motivation-body blockquote{font-size:18px}.home-motivation-foot{flex-direction:column;gap:4px}}

</style>
</head>
<body>
<div id="auth" class="auth-wrap"><div class="auth-card"><div class="brand">shift<span>mate</span></div><h1 id="authTitle">Your rota, organised.</h1><p class="muted" id="authSub">Sign in to manage your rotations and shifts.</p><div class="auth-tabs"><button id="tabLogin" class="active" onclick="setAuthMode('login')">Sign in</button><button id="tabSignup" onclick="setAuthMode('signup')">Create account</button></div><div id="nameField" class="field hidden"><label>Full name</label><input id="authName" autocomplete="name" placeholder="Your full name"></div><div id="rotaNameField" class="field hidden"><label>Name as shown on your rota</label><input id="authRotaName" autocomplete="off" placeholder="e.g. Jane Smith Doe"><small>Enter your name exactly as it appears on your hospital rota. You can update this later in your profile.</small></div><div class="field"><label>Email address</label><input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field" id="passwordField"><label>Password</label><input id="authPassword" type="password" autocomplete="current-password" placeholder="At least 8 characters"></div><div class="field hidden" id="confirmPasswordField"><label>Confirm new password</label><input id="authPasswordConfirm" type="password" autocomplete="new-password" placeholder="Enter your new password again"></div><div id="authMessage" class="notice hidden"></div><button class="btn" style="width:100%;margin-top:8px" id="authSubmit" onclick="submitAuth()">Sign in</button><div id="forgotWrap" class="small" style="text-align:center;margin-top:14px"><button type="button" class="btn ghost" onclick="setAuthMode('forgot')">Forgot password?</button></div><p class="small muted" style="margin-top:18px">Your rota information is private to your account.</p></div></div>
<div id="app" class="app hidden"><aside class="sidebar"><div class="brand">shift<span>mate</span></div><div class="nav-label">Workspace</div><button class="nav-btn active" data-page="home" onclick="navigate('home')"><span class="nav-icon">⌂</span><span class="nav-text">Overview</span></button><button class="nav-btn" data-page="rota" onclick="navigate('rota')"><span class="nav-icon">▦</span><span class="nav-text">My rota</span></button><button class="nav-btn" data-page="rotations" onclick="navigate('rotations')"><span class="nav-icon">◫</span><span class="nav-text">Rotations</span></button><div class="nav-label">Account</div><button class="nav-btn" data-page="profile" onclick="navigate('profile')"><span class="nav-icon">◎</span><span class="nav-text">Profile</span></button><div class="sidebar-bottom"><button class="nav-btn" onclick="signOut()"><span class="nav-icon">↪</span><span class="nav-text">Sign out</span></button></div></aside><main class="main"><header class="topbar"><div><div class="small muted" id="eyebrow">YOUR WORKSPACE</div><h1 id="pageTitle">Overview</h1></div><div class="user-pill" id="userPill"></div></header><div id="content"></div></main><nav class="mobile-menu"><button onclick="navigate('home')"><span>⌂</span>Home</button><button onclick="navigate('rota')"><span>▦</span>Rota</button><button onclick="navigate('rotations')"><span>◫</span>Rotations</button><button onclick="navigate('profile')"><span>◎</span>Profile</button><button onclick="signOut()"><span>↪</span>Exit</button></nav></div><div id="modalRoot"></div>
<script src="/app.js?v=ai-motivation-2"></script></body></html>
